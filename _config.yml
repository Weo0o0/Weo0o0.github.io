# The Site Configuration

theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

title: Weo0o0-Note
tagline: 밤에 읽히는 시스템 노트 — 권한·네트워크·보안을 한 편씩
description: >-
  권한·네트워크·보안을 한 편씩 정리한 Weo0o0-Note 개인 학습 블로그입니다.

url: "https://weo0o0.github.io"
baseurl: ""

github:
  username: Weo0o0

twitter:
  username: Weo0o0_

social:
  name: Weo0o0-Note
  email: weyuc25@gmail.com
  links:
    - https://github.com/Weo0o0
    - https://x.com/Weo0o0_

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Naver has no slot in Chirpy's SEO tags; it is emitted by _includes/metadata-hook.html.
naver_site_verification: "4937a1906b8e16613ea3b0dd1b941a2a4f60319e"

analytics:
  google:
    id: G-TXN38Y6JNC

pageviews:
  provider:

# Empty keeps Chirpy's theme switcher enabled; the first visit starts dark (see _includes/metadata-hook.html).
theme_mode:

cdn:

avatar: /assets/images/logo.jpg

social_preview_image:

toc: true

comments:
  provider: disqus
  disqus:
    shortname: we0o0o-note

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # Existing links inside posts and search engines point at this shape.
      permalink: /:categories/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

include:
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - test
  - tools
  - vendor
  - node_modules
  - README.md
  - CHANGELOG.md
  - LICENSE
  - Rakefile
  - staticman.yml
  - skills-lock.json
  - screenshot.png
  - screenshot-layouts.png
  - "*.config.js"
  - "package*.json"
  - .pa11yci

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

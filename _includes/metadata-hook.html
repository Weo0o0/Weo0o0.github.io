{%- if site.naver_site_verification -%}
  <meta name="naver-site-verification" content="{{ site.naver_site_verification }}">
{%- endif -%}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap"
>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
>
<link rel="stylesheet" href="{{ '/assets/css/weo0o0.css' | relative_url }}">

<script>
  /* Runs after Chirpy's theme.min.js and before first paint: first visit starts on the night theme. */
  if (window.Theme && Theme.isToggleable && !localStorage.getItem('theme')) {
    Theme.update(Theme.Mode.DARK);
  }
</script>

<script>
  (function () {
    var root = document.documentElement;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) return;
    root.classList.add('wn-motion');
    /* Cards start hidden under .wn-motion; never leave them hidden if the motion script fails. */
    window.setTimeout(function () {
      if (!root.classList.contains('wn-motion-ready')) root.classList.remove('wn-motion');
    }, 3000);
  })();
</script>
<script defer src="{{ '/assets/js/weo0o0-motion.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/weo0o0-theme.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/weo0o0-header.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/weo0o0-toc.js' | relative_url }}"></script>

<!--
  Replaces Chirpy's default bird favicon with the site avatar (assets/images/logo.jpg).
  The ?v= query drops a previously cached theme icon.
-->

{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}

<link rel="icon" type="image/png" href="{{ favicon_path }}/favicon-96x96.png?v=2" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg?v=2">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png?v=2">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
